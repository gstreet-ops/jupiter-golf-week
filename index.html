<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jupiter Golf Week</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f6f1;--s1:#ffffff;--s2:#f0ede5;--bd:#e0dbd0;--t:#2c2c2c;--t2:#666;--t3:#999;--shadow:0 1px 4px rgba(0,0,0,.06)}
body{background:var(--bg);color:var(--t);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit}
.mono{font-family:'DM Mono',monospace}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.page{display:none;min-height:100vh;flex-direction:column}.page.active{display:flex}

/* Landing */
#landing{position:relative;overflow:hidden}
.lbg{position:absolute;inset:0;background:linear-gradient(160deg,#eaf6f4,#f8f6f1 40%,#faf5ed)}
.lpat{position:absolute;inset:0;opacity:.04;background-image:radial-gradient(circle,#8b7d5e .5px,transparent .5px);background-size:24px 24px}
.lcontent{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:24px 20px}
.lhdr{text-align:center;padding-top:6vh}
.lhdr h1{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,7vw,56px);font-weight:700;color:#1a3a2a;line-height:1.1}
.lhdr .sub{font-size:11px;letter-spacing:3px;color:#8b7d5e;margin-top:10px;text-transform:uppercase}
.lhdr .loc{font-size:13px;color:var(--t3);margin-top:6px}

/* Weather banner */
.wx{max-width:500px;margin:20px auto 0;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;overflow-x:auto;box-shadow:var(--shadow)}
.wx-title{font-size:10px;letter-spacing:2px;color:var(--t3);margin-bottom:8px;font-weight:600}
.wx-days{display:flex;gap:6px}
.wx-day{flex:1;min-width:80px;padding:8px;border-radius:10px;text-align:center;background:var(--s2);border:1px solid var(--bd)}
.wx-day.today{border-color:#8b7d5e80;background:#faf5ed}
.wx-dn{font-size:10px;font-weight:600;color:var(--t2)}
.wx-dd{font-size:9px;color:var(--t3)}
.wx-icon{font-size:22px;margin:4px 0}
.wx-temp{font-size:16px;font-weight:700;color:#2c2c2c;font-family:'DM Mono',monospace}
.wx-rain{font-size:9px;color:var(--t3);margin-top:2px}
.wx-course{font-size:8px;margin-top:4px;padding:2px 6px;border-radius:10px;display:inline-block;font-weight:600}

/* Handicap */
.hdcp-bar{max-width:500px;width:100%;margin:16px auto 0;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.hdcp-bar label{font-size:11px;color:var(--t2);white-space:nowrap;font-weight:600}
.hdcp-bar input{width:70px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:#1a5a3a;font-size:16px;font-weight:700;text-align:center;padding:6px;font-family:'DM Mono',monospace}
.hdcp-bar input:focus{outline:none;border-color:#1a5a3a}
.hdcp-bar .hdcp-info{font-size:10px;color:var(--t3);line-height:1.4}

/* Course cards */
.cards{display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:500px;width:100%;margin-left:auto;margin-right:auto}
.cc{cursor:pointer;transition:all .3s;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);background:var(--s1);border:1px solid var(--bd)}
.cc:hover{box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(-1px)}
.cc-hero{height:160px;position:relative;overflow:hidden}
.cc-hero img{width:100%;height:100%;object-fit:cover}
.cc-hero svg{position:absolute;inset:0;width:100%;height:100%}
.cc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.1) 60%,rgba(0,0,0,0) 100%)}
.cc-day{position:absolute;top:10px;right:12px;font-size:9px;letter-spacing:2px;font-weight:700;padding:3px 10px;border-radius:12px;backdrop-filter:blur(8px);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.cc-info{position:absolute;bottom:0;left:0;right:0;padding:14px 16px}
.cc-name{font-size:20px;font-weight:700;color:#fff;font-family:'Cormorant Garamond',serif;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cc-sub{font-size:10px;color:rgba(255,255,255,.8);margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.cc-bottom{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.cc-stats{display:flex;gap:14px}
.cst .csl{font-size:8px;letter-spacing:1px;color:var(--t3)}.cst .csv{font-size:14px;font-weight:700;font-family:'DM Mono',monospace}
.cc-status{font-size:10px;font-weight:600}

/* Club page */
.club-hero{position:relative;overflow:hidden}
.club-hero-bg{height:220px;position:relative;overflow:hidden}
.club-hero-bg img{width:100%;height:100%;object-fit:cover}
.club-hero-bg svg{position:absolute;inset:0;width:100%;height:100%}
.club-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.15) 60%,rgba(0,0,0,0) 100%)}
.club-hero-content{position:absolute;bottom:0;left:0;right:0;padding:16px 20px}
.back{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .2s;position:absolute;top:14px;left:14px;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.back:hover{background:rgba(255,255,255,.3)}
.club-hero h2{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5.5vw,42px);font-weight:700;color:#fff;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.club-hero .hm{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
.hstats{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
.hs .hsl{font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.5)}.hs .hsv{font-size:17px;font-weight:700;font-family:'DM Mono',monospace;color:#fff}
.wx-inline{margin:12px 20px 0;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.wx-inline .wxi-icon{font-size:28px}.wx-inline .wxi-temp{font-size:20px;font-weight:700;color:#2c2c2c;font-family:'DM Mono',monospace}
.wx-inline .wxi-cond{font-size:12px;color:var(--t2)}.wx-inline .wxi-detail{font-size:10px;color:var(--t3)}

/* Tabs */
.tnav{display:flex;border-bottom:1px solid var(--bd);background:var(--s1);position:sticky;top:0;z-index:10;overflow-x:auto}
.tnav button{padding:11px 15px;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;letter-spacing:.4px;transition:all .2s;font-family:'DM Sans',sans-serif}
.tc{padding:18px;max-width:720px;margin:0 auto;width:100%}
.tp{display:none}.tp.active{display:block}

/* Sections */
.sec{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.stit{font-size:10px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;margin-bottom:8px;font-weight:600}
.sec p{font-size:13px;color:#555;line-height:1.7}
.feat li{font-size:12px;color:#666;padding:4px 0;display:flex;gap:8px;align-items:flex-start;line-height:1.5;list-style:none}
.fdot{font-size:8px;margin-top:5px;flex-shrink:0}



/* Holes */
.hole-detail{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow)}
.hole-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;transition:background .2s}
.hole-header:hover{background:var(--s2)}
.hole-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:'DM Mono',monospace;flex-shrink:0}
.hole-meta{flex:1;margin-left:10px}.hole-meta .hm-top{font-size:13px;font-weight:600;color:#333}.hole-meta .hm-tees{font-size:10px;color:var(--t3);margin-top:1px}
.hole-arrow{color:var(--t3);font-size:12px;transition:transform .2s}.hole-arrow.open{transform:rotate(90deg)}
.hole-body{display:none;padding:0 14px 12px;border-top:1px solid var(--bd)}.hole-body.open{display:block}
.hole-tip{font-size:12px;color:#666;line-height:1.6;margin-top:10px;padding:10px 12px;background:var(--s2);border-radius:8px;border-left:3px solid var(--bd)}
.tee-table{width:100%;margin-top:10px;border-collapse:collapse;font-size:11px}
.tee-table th{text-align:left;color:var(--t3);font-weight:600;padding:4px 8px;font-size:9px;letter-spacing:1px}
.tee-table td{padding:4px 8px;color:#666;border-top:1px solid var(--bd)}
.tee-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

/* Scores */
.score-section{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.score-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd)}.score-row:last-child{border-bottom:none}
.sr-hole{min-width:55px;display:flex;align-items:center;gap:5px}
.sr-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-family:'DM Mono',monospace}
.sr-info{font-size:9px;color:var(--t3);line-height:1.2}
.sr-input{display:flex;align-items:center;gap:2px;margin-left:auto}
.sbtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.sbtn:hover{background:#e8e4da}
.sinp{width:38px;text-align:center;background:var(--s2);border:1px solid var(--bd);border-radius:6px;font-size:14px;font-weight:700;padding:4px 0;font-family:'DM Mono',monospace;color:#333}
.sinp:focus{outline:none;border-color:#888}
.sr-net{min-width:32px;text-align:center;font-size:11px;font-weight:600}

/* Mini scorecard */
.msc{overflow-x:auto;padding-bottom:4px}
.mn{margin-bottom:6px}.mn-label{font-size:9px;letter-spacing:2px;color:var(--t3);margin-bottom:3px}
.mholes{display:flex;gap:2px}
.mh{text-align:center;min-width:30px}.mh-n{font-size:8px;color:var(--t3)}.mh-y{font-size:7px;color:#ccc}
.msb{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'DM Mono',monospace;margin:2px auto;transition:all .2s}
.mh-p{font-size:8px;color:var(--t3)}
.mt{min-width:36px;text-align:center;border-left:1px solid var(--bd);padding-left:4px}
.mt-v{width:32px;height:26px;border-radius:5px;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;margin:2px auto}
.sc-eagle{background:#ffd700;color:#000;border-radius:50%}.sc-birdie{background:#e63946;color:#fff;border-radius:50%}
.sc-par{background:transparent;color:#555;border:1px solid #ccc;border-radius:5px}.sc-bogey{background:#457b9d;color:#fff;border-radius:5px}
.sc-double{background:#1d3557;color:#fff;border-radius:5px}.sc-empty{background:transparent;color:#ccc;border:1px dashed #ddd;border-radius:5px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.leg{display:flex;align-items:center;gap:3px}.leg-d{width:8px;height:8px;display:inline-block}.leg-t{font-size:8px;color:var(--t3)}
.total-bar{margin-top:8px;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.total-bar .tl{font-size:12px;color:var(--t3)}.total-bar .ts{font-size:22px;font-weight:800;font-family:'DM Mono',monospace}
.total-bar .tv{font-size:11px;color:var(--t3);margin-left:6px}
.net-bar{margin-top:6px;padding:8px 14px;background:var(--s2);border-radius:10px;border:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.net-bar .nl{font-size:11px;color:var(--t3)}.net-bar .ns{font-size:18px;font-weight:700;color:#1a7a4a;font-family:'DM Mono',monospace}

/* Stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:6px}
.scard{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px}
.scard .scl{font-size:8px;color:var(--t3);letter-spacing:1px}.scard .scv{font-size:18px;font-weight:800;font-family:'DM Mono',monospace}
.scard .scs{font-size:10px;color:var(--t3)}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill{padding:3px 8px;border-radius:16px;background:var(--s2);display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t2);border:1px solid var(--bd)}
.pill .pc{font-size:13px;font-weight:800;font-family:'DM Mono',monospace}

/* Notes */
/* Dashboard */
.dash{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.dash-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#1a3a2a;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.dash-card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.dash-card .dc-label{font-size:8px;letter-spacing:1.5px;color:var(--t3);font-weight:600;margin-bottom:2px}
.dash-card .dc-val{font-size:20px;font-weight:800;font-family:'DM Mono',monospace}
.dash-card .dc-sub{font-size:9px;color:var(--t3);margin-top:1px}
.dash-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dash-bar-label{font-size:11px;font-weight:600;min-width:80px;color:#555}
.dash-bar-track{flex:1;height:22px;background:var(--s2);border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--bd)}
.dash-bar-fill{height:100%;border-radius:5px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;font-weight:700;color:#fff;min-width:30px}
.dash-bar-par{position:absolute;height:100%;width:2px;background:#e63946;top:0;opacity:.6}
.dash-h2h{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dash-h2h-card{padding:8px;border-radius:8px;text-align:center;border:1px solid var(--bd)}
.dash-h2h-card .hh-course{font-size:9px;letter-spacing:1px;font-weight:600;margin-bottom:4px}
.dash-h2h-card .hh-val{font-size:16px;font-weight:800;font-family:'DM Mono',monospace}
.dash-h2h-card .hh-sub{font-size:9px;color:var(--t3)}
.dash-best{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.dash-best-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--s2);border-radius:8px;border:1px solid var(--bd)}
.dash-best-row .br-icon{font-size:16px}
.dash-best-row .br-label{font-size:11px;color:#555;flex:1}
.dash-best-row .br-val{font-size:13px;font-weight:700;font-family:'DM Mono',monospace}
.dash-section{margin-top:16px}
.dash-section .ds-title{font-size:10px;letter-spacing:2px;color:var(--t3);font-weight:600;margin-bottom:8px}
.dash-empty{text-align:center;padding:20px;color:var(--t3);font-size:12px}

/* Save button */
.save-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.save-btn{padding:10px 24px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;letter-spacing:.3px}
.save-btn.primary{background:#1a7a4a;color:#fff;box-shadow:0 2px 8px rgba(26,122,74,.3)}
.save-btn.primary:hover{background:#158040}
.save-btn.primary:disabled{background:#ccc;color:#999;box-shadow:none;cursor:default}
.save-btn.secondary{background:var(--s2);color:var(--t2);border:1px solid var(--bd)}
.save-btn.secondary:hover{background:#e8e4da}
.save-status{font-size:11px;color:var(--t3);margin-left:auto}
.save-status.saved{color:#1a7a4a}
.save-status.unsaved{color:#a07830}
.editing-badge{display:inline-block;font-size:9px;letter-spacing:1px;padding:2px 8px;border-radius:10px;background:#faf0dd;color:#a07830;font-weight:600;margin-left:8px}

.nta{width:100%;min-height:90px;padding:12px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;color:#555;font-size:13px;resize:vertical;line-height:1.6;font-family:'DM Sans',sans-serif}.nta:focus{outline:none;border-color:#aaa}

@media(max-width:480px){.hstats{gap:10px}.sgrid{grid-template-columns:1fr 1fr}.wx-days{gap:4px}.wx-day{min-width:62px;padding:6px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="landing" class="page active">
<div class="lbg"></div><div class="lpat"></div>
<div class="lcontent">
<div class="lhdr">
<h1>Jupiter<br>Golf Week</h1>
<div class="sub">Three Legendary Courses · Feb 23–25</div>
<div class="loc">Hobe Sound & Jupiter, Florida</div>
</div>
<div class="wx" id="wx-bar"></div>
<div class="hdcp-bar">
<label>Handicap Index</label>
<input type="number" id="hdcp-input" step="0.1" min="0" max="54" placeholder="0.0" oninput="setHdcp(this.value)">
<div class="hdcp-info">Enter handicap index — net scores auto-calculate per course slope.</div>
</div>
<div class="cards" id="landing-cards"></div>
<div id="dashboard" style="max-width:500px;width:100%;margin:20px auto 0"></div>
<div style="text-align:center;padding:30px 0 20px;font-size:9px;color:#bbb;letter-spacing:1px">JUPITER GOLF WEEK 2026</div>
</div>
</div>
<div id="club-page" class="page"></div>

// Live NWS Weather
const NWS_POINT='https://api.weather.gov/points/27.0530,-80.1200'; // Hobe Sound/Jupiter area
let WX={mon:{},tue:{},wed:{},thu:{},sun:{}};
let wxLoaded=false;

async function fetchWeather(){
try{
// Step 1: Get forecast URLs from the point
const pt=await fetch(NWS_POINT,{headers:{'User-Agent':'JupiterGolfWeek/1.0'}});
const ptData=await pt.json();
const forecastUrl=ptData.properties.forecast;
const hourlyUrl=ptData.properties.forecastHourly;

// Step 2: Get 7-day forecast
const fc=await fetch(forecastUrl,{headers:{'User-Agent':'JupiterGolfWeek/1.0'}});
const fcData=await fc.json();
const periods=fcData.properties.periods;

// Step 3: Get hourly forecast
const hr=await fetch(hourlyUrl,{headers:{'User-Agent':'JupiterGolfWeek/1.0'}});
const hrData=await hr.json();
const hourlyPeriods=hrData.properties.periods;

// Map periods to days — NWS returns day/night pairs
// We need to match to our trip dates: Sun 2/22, Mon 2/23, Tue 2/24, Wed 2/25, Thu 2/26
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const tripDates={
sun:new Date(2026,1,22),
mon:new Date(2026,1,23),
tue:new Date(2026,1,24),
wed:new Date(2026,1,25),
thu:new Date(2026,1,26)
};

function wxIcon(short){
const s=short.toLowerCase();
if(s.includes('thunder'))return '⛈️';
if(s.includes('rain')||s.includes('shower'))return '🌧️';
if(s.includes('partly')||s.includes('mostly cloudy'))return '⛅';
if(s.includes('mostly sunny')||s.includes('mostly clear'))return '🌤️';
if(s.includes('sunny')||s.includes('clear'))return '☀️';
if(s.includes('cloudy')||s.includes('overcast'))return '☁️';
if(s.includes('fog'))return '🌫️';
return '🌤️';
}

function rainChance(detailed){
const m=detailed.match(/(\d+)\s*percent/i);
return m?parseInt(m[1]):0;
}

// Process 7-day periods into our format
Object.keys(tripDates).forEach(key=>{
const target=tripDates[key];
const dateStr=target.toISOString().split('T')[0];
const dayPeriod=periods.find(p=>p.startTime.startsWith(dateStr)&&p.isDaytime);
const nightPeriod=periods.find(p=>p.startTime.startsWith(dateStr)&&!p.isDaytime);

if(dayPeriod){
WX[key]={
day:dayNames[target.getDay()],
date:monthNames[target.getMonth()]+' '+target.getDate(),
high:dayPeriod.temperature,
low:nightPeriod?nightPeriod.temperature:dayPeriod.temperature-15,
icon:wxIcon(dayPeriod.shortForecast),
cond:dayPeriod.shortForecast,
rain:rainChance(dayPeriod.detailedForecast),
wind:dayPeriod.windSpeed+' '+dayPeriod.windDirection,
hourly:[]
};

// Get hourly for this day (7AM-5PM golf hours)
const dayHours=hourlyPeriods.filter(h=>{
const d=new Date(h.startTime);
return d.toISOString().startsWith(dateStr)&&d.getHours()>=7&&d.getHours()<=17;
});

WX[key].hourly=dayHours.map(h=>{
const d=new Date(h.startTime);
const hour=d.getHours();
const ampm=hour>=12?'PM':'AM';
const h12=hour>12?hour-12:hour===0?12:hour;
return{
t:h12+' '+ampm,
temp:h.temperature,
icon:wxIcon(h.shortForecast),

function courseHdcp(slope){return Math.round(hdcp*(slope/113))}
function netScore(gross,slope,holeH){
if(!gross||!hdcp)return gross;
const ch=courseHdcp(slope),strokes=holeH<=ch?1:0,extra=holeH<=(ch-18)?1:0;
return gross-strokes-extra;
}

${ch?`<div class="cst"><span class="csl">CHDCP</span><span class="csv" style="color:#1a7a4a">${ch}</span></div>`:''}
${total?`<div class="cst"><span class="csl">GROSS</span><span class="csv" style="color:${c.accent}">${total}</span></div>`:''}
${netTotal?`<div class="cst"><span class="csl">NET</span><span class="csv" style="color:#1a7a4a">${netTotal}</span></div>`:''}
</div>
<div class="cc-status" style="color:${scored===18?'#1a7a4a':scored>0?'#a07830':'var(--t3)'}">
${scored===18?'✓ Complete':scored>0?scored+'/18':'Ready'}
</div></div></div>`}).join('');
renderDashboard();
}

</div></div></div></div>

function rOverview(k){
const c=C[k];
return `
<div class="sec"><div class="stit">About</div><p>${c.desc}</p></div>
<div class="sec"><div class="stit">History & Heritage</div><p>${c.history}</p></div>
<div class="sec"><div class="stit">Course Character</div><p>${c.character}</p></div>
<div class="sec"><div class="stit">Key Features</div><ul class="feat">${c.features.map(f=>`<li><span class="fdot" style="color:${c.accent}">◆</span>${f}</li>`).join('')}</ul></div>
<div class="sec"><div class="stit">Tee Boxes</div>
<table class="tee-table"><tr><th>TEE</th><th>YARDS</th><th>SLOPE</th><th>RATING</th>${hdcp?'<th>CHDCP</th>':''}</tr>
${c.tees.map(t=>`<tr><td><span class="tee-dot" style="background:${t.color};${t.color==='#eee'?'border:1px solid #999':''}${t.color==='#111'?'border:1px solid #666':''}"></span>${t.name}</td><td class="mono">${t.yards.toLocaleString()}</td><td class="mono">${t.slope}</td><td class="mono">${t.rating}</td>${hdcp?`<td class="mono" style="color:#1a7a4a">${courseHdcp(t.slope)}</td>`:''}</tr>`).join('')}
</table></div>
<div class="sec"><div class="stit">Course Summary</div>
<div class="sgrid">
<div class="scard"><div class="scl">TOTAL</div><div class="scv" style="color:${c.accent}">${c.yards.toLocaleString()}</div><div class="scs">yards</div></div>
<div class="scard"><div class="scl">PAR 3s</div><div class="scv" style="color:${c.accent}">${c.holes.filter(h=>h.p===3).length}</div><div class="scs">avg ${Math.round(c.holes.filter(h=>h.p===3).reduce((s,h)=>s+(h.b||h.g||h.t),0)/c.holes.filter(h=>h.p===3).length)} yds</div></div>
<div class="scard"><div class="scl">PAR 4s</div><div class="scv" style="color:${c.accent}">${c.holes.filter(h=>h.p===4).length}</div><div class="scs">avg ${Math.round(c.holes.filter(h=>h.p===4).reduce((s,h)=>s+(h.b||h.g||h.t),0)/c.holes.filter(h=>h.p===4).length)} yds</div></div>
<div class="scard"><div class="scl">PAR 5s</div><div class="scv" style="color:${c.accent}">${c.holes.filter(h=>h.p===5).length}</div><div class="scs">avg ${Math.round(c.holes.filter(h=>h.p===5).reduce((s,h)=>s+(h.b||h.g||h.t),0)/c.holes.filter(h=>h.p===5).length)} yds</div></div>
</div></div>`;
}

function getYds(k,h,teeName){
if(k==='medalist'){
if(teeName==='Tiger')return h.t||h.g;if(teeName==='Gold')return h.g||h.b;
}
if(k==='bears'){if(teeName==='Gold')return h.g||h.b;}
if(teeName==='Blue')return h.b;if(teeName==='White')return h.w;if(teeName==='Red')return h.r;
return h.b||h.g||h.t;
}

function rHoles(k){
const c=C[k];
const front=c.holes.slice(0,9),back=c.holes.slice(9);
const mainYds=h=>h.b||h.g||h.t;
const fp=front.reduce((s,h)=>s+h.p,0),bp=back.reduce((s,h)=>s+h.p,0);
const fy=front.reduce((s,h)=>s+mainYds(h),0),by=back.reduce((s,h)=>s+mainYds(h),0);
return `
<div class="sec" style="padding:8px 14px"><div class="stit" style="margin:0;color:${c.accent}">FRONT NINE · Par ${fp} · ${fy.toLocaleString()} yds</div></div>
${front.map(h=>holeCard(k,h)).join('')}
<div class="sec" style="padding:8px 14px;margin-top:4px"><div class="stit" style="margin:0;color:${c.accent}">BACK NINE · Par ${bp} · ${by.toLocaleString()} yds</div></div>
${back.map(h=>holeCard(k,h)).join('')}`;
}

function holeCard(k,h){
const c=C[k];
const mainYds=h.b||h.g||h.t;
const pClass=h.p===3?'background:#e0f5ee;color:#0d7d6c':h.p===4?'background:#e0eef8;color:#2563eb':'background:#faf0dd;color:#a07830';
return `<div class="hole-detail">
<div class="hole-header" onclick="toggleHole('${k}',${h.n})">
<div class="hole-num" style="${pClass}">${h.n}</div>
<div class="hole-meta">
<div class="hm-top">Par ${h.p} · ${mainYds} yds · HDCP ${h.h}</div>
<div class="hm-tees">${c.tees.map(t=>`<span style="color:${t.color==='#111'?'#666':t.color==='#eee'?'#999':t.color}">${t.name}: ${getYds(k,h,t.name)}</span>`).join(' · ')}</div>
</div>
<span class="hole-arrow" id="arrow-${k}-${h.n}">▶</span>
</div>
<div class="hole-body" id="body-${k}-${h.n}">
<div class="hole-tip" style="border-left-color:${c.accent}">${h.tip}</div>
<table class="tee-table"><tr><th>TEE</th><th>YARDS</th></tr>
${c.tees.map(t=>`<tr><td><span class="tee-dot" style="background:${t.color};${t.color==='#eee'?'border:1px solid #999':''}${t.color==='#111'?'border:1px solid #666':''}"></span>${t.name}</td><td class="mono">${getYds(k,h,t.name)}</td></tr>`).join('')}
</table>
</div></div>`;
}
function toggleHole(k,n){
document.getElementById('body-'+k+'-'+n).classList.toggle('open');
document.getElementById('arrow-'+k+'-'+n).classList.toggle('open');
}

function scClass(s,p){if(!s)return 'sc-empty';const d=s-p;if(d<=-2)return 'sc-eagle';if(d===-1)return 'sc-birdie';if(d===0)return 'sc-par';if(d===1)return 'sc-bogey';return 'sc-double'}

function rMini(k){
const c=C[k],d=D[k];
const mainYds=h=>h.b||h.g||h.t;
const fr=c.holes.slice(0,9),bk=c.holes.slice(9);
const fp=fr.reduce((s,h)=>s+h.p,0),bp=bk.reduce((s,h)=>s+h.p,0);
const fs=d.scores.slice(0,9).reduce((s,v)=>s+v,0),bs=d.scores.slice(9).reduce((s,v)=>s+v,0);
let html='<div class="msc">';
[{l:'FRONT',hs:fr,st:0,p:fp,sc:fs},{l:'BACK',hs:bk,st:9,p:bp,sc:bs}].forEach(n=>{
html+=`<div class="mn"><div class="mn-label">${n.l} NINE</div><div class="mholes">`;
n.hs.forEach((hole,i)=>{const idx=n.st+i;const s=d.scores[idx];
html+=`<div class="mh"><div class="mh-n">${hole.n}</div><div class="mh-y">${mainYds(hole)}</div><div class="msb ${scClass(s,hole.p)}">${s||'–'}</div><div class="mh-p">P${hole.p}</div></div>`;
});
html+=`<div class="mt"><div class="mh-n">${n.st===0?'OUT':'IN'}</div><div class="mh-y">&nbsp;</div><div class="mt-v" style="color:${c.accent}">${n.sc||'–'}</div><div class="mh-p">P${n.p}</div></div></div></div>`;
});
if(d.scores.filter(s=>s>0).length===18){
const total=fs+bs,tp=total-c.par;
html+=`<div class="total-bar" style="background:${c.accentBg};border:1px solid ${c.accentBd}"><span class="tl">GROSS</span><div><span class="ts" style="color:${c.accent}">${total}</span><span class="tv">(${tp>0?'+':''}${tp})</span></div></div>`;
if(hdcp){let nt=0;d.scores.forEach((s,i)=>{nt+=netScore(s,c.slope,c.holes[i].h)});
const ntp=nt-c.par;
html+=`<div class="net-bar"><span class="nl">NET (HDCP ${courseHdcp(c.slope)})</span><span class="ns">${nt} (${ntp>0?'+':''}${ntp})</span></div>`;}
}
html+=`<div class="legend">
<div class="leg"><span class="leg-d" style="background:#ffd700;border-radius:50%"></span><span class="leg-t">Eagle+</span></div>
<div class="leg"><span class="leg-d" style="background:#e63946;border-radius:50%"></span><span class="leg-t">Birdie</span></div>
<div class="leg"><span class="leg-d" style="border:1px solid #ccc;border-radius:3px"></span><span class="leg-t">Par</span></div>
<div class="leg"><span class="leg-d" style="background:#457b9d;border-radius:3px"></span><span class="leg-t">Bogey</span></div>
<div class="leg"><span class="leg-d" style="background:#1d3557;border-radius:3px"></span><span class="leg-t">Dbl+</span></div>
</div></div>`;
return html;
}

function rPerf(k){
const c=C[k],d=D[k],done=d.scores.filter(s=>s>0);
if(done.length<9)return '<div style="text-align:center;padding:16px;color:var(--t3);font-size:12px">Enter at least 9 holes to see analysis</div>';
const total=d.scores.reduce((s,v)=>s+v,0),tp=total-c.par;
const pars=d.scores.filter((s,i)=>s>0&&s===c.holes[i].p).length;
const birdies=d.scores.filter((s,i)=>s>0&&s===c.holes[i].p-1).length;
const eagles=d.scores.filter((s,i)=>s>0&&s<=c.holes[i].p-2).length;
const bogeys=d.scores.filter((s,i)=>s>0&&s===c.holes[i].p+1).length;
const doubles=d.scores.filter((s,i)=>s>0&&s>=c.holes[i].p+2).length;
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
const p3=c.holes.map((h,i)=>h.p===3&&d.scores[i]>0?d.scores[i]:null).filter(Boolean);
const p4=c.holes.map((h,i)=>h.p===4&&d.scores[i]>0?d.scores[i]:null).filter(Boolean);
const p5=c.holes.map((h,i)=>h.p===5&&d.scores[i]>0?d.scores[i]:null).filter(Boolean);
const fs=d.scores.slice(0,9).reduce((s,v)=>s+v,0),bs=d.scores.slice(9).reduce((s,v)=>s+v,0);
const fp=c.holes.slice(0,9).reduce((s,h)=>s+h.p,0),bp=c.holes.slice(9).reduce((s,h)=>s+h.p,0);
return `<div class="stit" style="margin-top:12px;color:${c.accent}">PERFORMANCE</div>
<div class="sgrid">
<div class="scard"><div class="scl">SCORE</div><div class="scv" style="color:${c.accent}">${total}</div><div class="scs">${tp>0?'+':''}${tp}</div></div>
<div class="scard"><div class="scl">FRONT</div><div class="scv" style="color:${c.accent}">${fs}</div><div class="scs">${fs-fp>0?'+':''}${fs-fp}</div></div>
<div class="scard"><div class="scl">BACK</div><div class="scv" style="color:${c.accent}">${bs}</div><div class="scs">${bs-bp>0?'+':''}${bs-bp}</div></div>
<div class="scard"><div class="scl">PAR 3</div><div class="scv" style="color:${c.accent}">${avg(p3)}</div><div class="scs">avg</div></div>
<div class="scard"><div class="scl">PAR 4</div><div class="scv" style="color:${c.accent}">${avg(p4)}</div><div class="scs">avg</div></div>
<div class="scard"><div class="scl">PAR 5</div><div class="scv" style="color:${c.accent}">${avg(p5)}</div><div class="scs">avg</div></div>
</div>
<div class="pills">
<div class="pill" style="border-color:#ffd70040"><span class="pc" style="color:#b8960a">${eagles}</span>Eagles</div>
<div class="pill" style="border-color:#e6394640"><span class="pc" style="color:#e63946">${birdies}</span>Birdies</div>
<div class="pill" style="border-color:#88888840"><span class="pc" style="color:#666">${pars}</span>Pars</div>
<div class="pill" style="border-color:#457b9d40"><span class="pc" style="color:#457b9d">${bogeys}</span>Bogeys</div>
<div class="pill" style="border-color:#1d355740"><span class="pc" style="color:#1d3557">${doubles}</span>Double+</div>
</div>`;
}

function rScores(k){
const c=C[k],d=D[k],ch=hdcp?courseHdcp(c.slope):null;
const mainYds=h=>h.b||h.g||h.t;
const dayLabels={jupiter:'Monday, Feb 23',bears:'Tuesday, Feb 24',medalist:'Wednesday, Feb 25'};
return `
<div class="sec">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<div class="stit" style="margin:0;color:${c.accent}">SCORECARD — ${dayLabels[k]}</div>
</div>
<div class="save-bar">
<button class="save-btn primary" id="${k}-save-btn" onclick="saveRound('${k}')" disabled>💾 Save Round</button>
<button class="save-btn secondary" onclick="clearRound('${k}')">↺ Reset</button>
<span class="save-status" id="${k}-save-status"></span>
</div>
<div id="${k}-mini">${rMini(k)}</div>
</div>
<div class="score-section">
<div class="stit">ENTER SCORES</div>
${c.holes.map((h,i)=>{
const s=d.scores[i],ns=hdcp&&s?netScore(s,c.slope,h.h):null;
const strokes=ch&&h.h<=ch?(h.h<=(ch-18)?2:1):0;
const pClass=h.p===3?'background:#e0f5ee;color:#0d7d6c':h.p===4?'background:#e0eef8;color:#2563eb':'background:#faf0dd;color:#a07830';
return `<div class="score-row">
<div class="sr-hole">
<div class="sr-num" style="${pClass}">${h.n}</div>
<div class="sr-info">P${h.p}·${mainYds(h)}y${strokes?`<br><span style="color:#1a7a4a">${strokes}●</span>`:''}</div>
</div>
<div class="sr-input">
<button class="sbtn" onclick="adj('${k}',${i},-1)">−</button>
<input type="number" class="sinp" id="si-${k}-${i}" value="${s||''}" placeholder="${h.p}" style="color:${c.accent}" onchange="setSc('${k}',${i},this.value)">
<button class="sbtn" onclick="adj('${k}',${i},1)">+</button>
</div>
${hdcp?`<div class="sr-net" style="color:${ns?'#1a7a4a':'var(--t3)'}">${ns||'–'}</div>`:''}
</div>`}).join('')}
</div>
<div id="${k}-perf">${rPerf(k)}</div>
<div class="sec" style="margin-top:12px"><div class="stit">ROUND NOTES</div>
<textarea class="nta" placeholder="Memorable shots, course impressions, key takeaways..." onchange="D['${k}'].notes=this.value;save();markDirty('${k}')">${d.notes}</textarea></div>`;
}
function setSc(k,i,v){D[k].scores[i]=Math.max(0,Math.min(15,parseInt(v)||0));save();markDirty(k);rfSc(k)}
function adj(k,i,d2){const c=C[k],h=c.holes[i],cur=D[k].scores[i]||(h.p);D[k].scores[i]=Math.max(1,Math.min(15,cur+d2));document.getElementById('si-'+k+'-'+i).value=D[k].scores[i];save();markDirty(k);rfSc(k)}
async function clearRound(k){
if(!confirm('Reset all scores for this round?'))return;
D[k].scores=Array(18).fill(0);D[k].notes='';
save();markDirty(k);
const pg=document.getElementById('club-page');
if(pg.classList.contains('active'))renderClub(k);
}

function rfSc(k){document.getElementById(k+'-mini').innerHTML=rMini(k);document.getElementById(k+'-perf').innerHTML=rPerf(k)}

function rWeather(k){
const c=C[k];
const wx=WX[SCHED[k]];
if(!wx||!wx.hourly||!wx.hourly.length)return '<div class="sec"><p>Hourly forecast loading or not yet available. Refresh in a moment.</p></div>';
return `
<div class="sec">
<div class="stit" style="color:${c.accent}">FORECAST OVERVIEW</div>
<div style="display:flex;align-items:center;gap:14px;padding:8px 0">
<span style="font-size:36px">${wx.icon}</span>
<div>
<div style="font-size:18px;font-weight:700;color:#2c2c2c">${wx.cond}</div>
<div style="font-size:12px;color:var(--t2)">High ${wx.high}°F · Low ${wx.low}°F · Wind: ${wx.wind}</div>
<div style="font-size:11px;color:var(--t3)">${wx.rain>0?'💧 '+wx.rain+'% chance of rain':'☀️ No rain expected'}</div>
</div>
</div>
<div style="font-size:11px;color:var(--t3);margin-top:4px">Source: National Weather Service · Live data · Hobe Sound/Jupiter area</div>
</div>
<div class="sec">
<div class="stit" style="color:${c.accent}">HOURLY CONDITIONS</div>
<div style="overflow-x:auto">
<table style="width:100%;border-collapse:collapse;font-size:12px;min-width:500px">
<tr style="border-bottom:1px solid var(--bd)">
<th style="text-align:left;padding:6px 8px;font-size:9px;letter-spacing:1px;color:var(--t3)">TIME</th>
<th style="text-align:center;padding:6px 4px;font-size:9px;color:var(--t3)"></th>
<th style="text-align:center;padding:6px 8px;font-size:9px;letter-spacing:1px;color:var(--t3)">TEMP</th>
<th style="text-align:left;padding:6px 8px;font-size:9px;letter-spacing:1px;color:var(--t3)">WIND</th>
<th style="text-align:left;padding:6px 8px;font-size:9px;letter-spacing:1px;color:var(--t3)">CONDITIONS</th>
</tr>
${wx.hourly.map(h=>{
const tempColor=h.temp>=78?'#a07830':h.temp>=70?'#1a7a4a':h.temp>=65?'#2563eb':'#666';
return `<tr style="border-bottom:1px solid var(--bd)">
<td style="padding:6px 8px;font-weight:600;color:#444;font-family:'DM Mono',monospace;white-space:nowrap">${h.t}</td>
<td style="text-align:center;font-size:18px;padding:4px">${h.icon}</td>
<td style="text-align:center;padding:6px 8px;font-weight:700;color:${tempColor};font-family:'DM Mono',monospace">${h.temp}°</td>
<td style="padding:6px 8px;color:var(--t2);white-space:nowrap">${h.wind}</td>
<td style="padding:6px 8px;color:#555">${h.desc}</td>
</tr>`}).join('')}
</table>
</div>
</div>
<div class="sec">
<div class="stit">GOLF WEATHER TIPS</div>
<p style="font-size:12px;color:#666;line-height:1.7">${
wx.rain>=50?'Significant rain chance — pack a rain jacket and keep towels handy. Consider waterproof gloves if you have them.':
wx.rain>=20?'Some chance of showers — bring a light rain layer just in case. Conditions may change quickly.':
wx.high>=85?'Hot day — bring plenty of water, sunscreen, and a hat. Consider a cart if walking is optional.':
wx.high<=65?'Cool morning expected — layer up early, you can always peel off layers as it warms.':
'Great golf weather — enjoy it out there!'
}${wx.wind&&wx.wind.includes('15')||wx.wind&&wx.wind.includes('20')?' Expect noticeable wind — club up on exposed holes and keep the ball low when possible.':''}</p>
</div>`;
}

function renderDashboard(){
const el=document.getElementById('dashboard');
const courses=['jupiter','bears','medalist'];
const completed=courses.filter(k=>D[k].scores.filter(s=>s>0).length===18);

if(completed.length===0){
el.innerHTML=`<div class="dash"><div class="dash-title">📊 Trip Dashboard</div><div class="dash-empty">Complete a round to see your analytics</div></div>`;
return;
}

// Aggregate stats
const stats=courses.map(k=>{
const c=C[k],d=D[k];
const scores=d.scores;
const done=scores.filter(s=>s>0).length;
if(done===0)return null;
const total=scores.reduce((a,b)=>a+b,0);
const vs=total-c.par;
const eagles=scores.filter((s,i)=>s>0&&s<=c.holes[i].p-2).length;
const birdies=scores.filter((s,i)=>s>0&&s===c.holes[i].p-1).length;
const pars=scores.filter((s,i)=>s>0&&s===c.holes[i].p).length;
const bogeys=scores.filter((s,i)=>s>0&&s===c.holes[i].p+1).length;
const doubles=scores.filter((s,i)=>s>0&&s>=c.holes[i].p+2).length;
const p3=c.holes.map((h,i)=>h.p===3&&scores[i]>0?scores[i]:null).filter(Boolean);
const p4=c.holes.map((h,i)=>h.p===4&&scores[i]>0?scores[i]:null).filter(Boolean);
const p5=c.holes.map((h,i)=>h.p===5&&scores[i]>0?scores[i]:null).filter(Boolean);
const avgP3=p3.length?(p3.reduce((a,b)=>a+b,0)/p3.length):0;
const avgP4=p4.length?(p4.reduce((a,b)=>a+b,0)/p4.length):0;
const avgP5=p5.length?(p5.reduce((a,b)=>a+b,0)/p5.length):0;
const best=Math.min(...scores.filter(s=>s>0));
const bestHole=scores.indexOf(best);
const worst=Math.max(...scores);
const worstHole=scores.indexOf(worst);
const front=scores.slice(0,9).reduce((a,b)=>a+b,0);
const back=scores.slice(9).reduce((a,b)=>a+b,0);
const frontPar=c.holes.slice(0,9).reduce((s,h)=>s+h.p,0);
const backPar=c.holes.slice(9).reduce((s,h)=>s+h.p,0);
let netTotal=null;
if(hdcp&&done===18){netTotal=0;scores.forEach((s,i)=>{netTotal+=netScore(s,c.slope,c.holes[i].h)});}
return{k,name:c.short,accent:c.accent,par:c.par,total,vs,done,eagles,birdies,pars,bogeys,doubles,
avgP3,avgP4,avgP5,best,bestHole:bestHole+1,worst,worstHole:worstHole+1,
front,back,frontPar,backPar,netTotal,slope:c.slope};
}).filter(Boolean);

const allScored=stats.filter(s=>s.done===18);
const totalStrokes=allScored.reduce((a,s)=>a+s.total,0);
const totalPar=allScored.reduce((a,s)=>a+s.par,0);
const totalVs=totalStrokes-totalPar;
const totalBirdies=stats.reduce((a,s)=>a+s.birdies,0);
const totalPars=stats.reduce((a,s)=>a+s.pars,0);
const totalBogeys=stats.reduce((a,s)=>a+s.bogeys,0);
const totalEagles=stats.reduce((a,s)=>a+s.eagles,0);
const totalDoubles=stats.reduce((a,s)=>a+s.doubles,0);
const holesPlayed=stats.reduce((a,s)=>a+s.done,0);

// Best round
const bestRound=allScored.length?allScored.reduce((a,b)=>a.vs<b.vs?a:b):null;

let html=`<div class="dash">
<div class="dash-title">📊 Trip Dashboard</div>`;

// Summary cards
html+=`<div class="dash-grid">
<div class="dash-card"><div class="dc-label">TOTAL</div><div class="dc-val" style="color:#1a3a2a">${totalStrokes||'–'}</div><div class="dc-sub">${allScored.length?allScored.length+' round'+(allScored.length>1?'s':''):'–'}</div></div>
<div class="dash-card"><div class="dc-label">VS PAR</div><div class="dc-val" style="color:${totalVs<=0?'#1a7a4a':'#b82e3a'}">${allScored.length?(totalVs>0?'+':'')+totalVs:'–'}</div><div class="dc-sub">${holesPlayed} holes</div></div>
<div class="dash-card"><div class="dc-label">BEST</div><div class="dc-val" style="color:${bestRound?bestRound.accent:'#999'}">${bestRound?bestRound.total:'–'}</div><div class="dc-sub">${bestRound?bestRound.name:'–'}</div></div>
</div>`;

// Head to head bars — gross scores
if(allScored.length>1){
html+=`<div class="dash-section"><div class="ds-title">HEAD TO HEAD — GROSS</div>`;
const maxScore=Math.max(...allScored.map(s=>s.total));
allScored.forEach(s=>{
const pct=Math.round((s.total/maxScore)*100);
html+=`<div class="dash-bar-row">
<div class="dash-bar-label" style="color:${s.accent}">${s.name}</div>
<div class="dash-bar-track">
<div class="dash-bar-fill" style="width:${pct}%;background:${s.accent}">${s.total}</div>
<div class="dash-bar-par" style="left:${Math.round((s.par/maxScore)*100)}%" title="Par ${s.par}"></div>
</div>
</div>`;
});
html+=`</div>`;
}

// Net comparison if handicap set
if(hdcp&&allScored.filter(s=>s.netTotal).length>1){
html+=`<div class="dash-section"><div class="ds-title">HEAD TO HEAD — NET (HDCP ${hdcp})</div>`;
const netScores=allScored.filter(s=>s.netTotal);
const maxNet=Math.max(...netScores.map(s=>s.netTotal));
netScores.forEach(s=>{
const pct=Math.round((s.netTotal/maxNet)*100);
const nv=s.netTotal-s.par;
html+=`<div class="dash-bar-row">
<div class="dash-bar-label" style="color:${s.accent}">${s.name}</div>
<div class="dash-bar-track">
<div class="dash-bar-fill" style="width:${pct}%;background:#1a7a4a">${s.netTotal} (${nv>0?'+':''}${nv})</div>
<div class="dash-bar-par" style="left:${Math.round((s.par/maxNet)*100)}%" title="Par ${s.par}"></div>
</div>
</div>`;
});
html+=`</div>`;
}

// Scoring breakdown comparison
html+=`<div class="dash-section"><div class="ds-title">SCORING BREAKDOWN</div>
<div class="dash-h2h">`;
stats.forEach(s=>{
html+=`<div class="dash-h2h-card" style="background:${s.accent}08">
<div class="hh-course" style="color:${s.accent}">${s.name}</div>
<div style="display:flex;flex-direction:column;gap:2px;font-size:10px">
${s.eagles?`<div style="color:#b8960a">🦅 ${s.eagles} eagle${s.eagles>1?'s':''}</div>`:''}
<div style="color:#e63946">🐦 ${s.birdies} birdie${s.birdies!==1?'s':''}</div>
<div style="color:#666">⛳ ${s.pars} par${s.pars!==1?'s':''}</div>
<div style="color:#457b9d">📦 ${s.bogeys} bogey${s.bogeys!==1?'s':''}</div>
${s.doubles?`<div style="color:#1d3557">💀 ${s.doubles} dbl+</div>`:''}
</div>
</div>`;
});
html+=`</div></div>`;

// Par performance comparison
html+=`<div class="dash-section"><div class="ds-title">AVG SCORE BY PAR</div>
<div class="dash-h2h">`;
stats.forEach(s=>{
html+=`<div class="dash-h2h-card" style="background:${s.accent}08">
<div class="hh-course" style="color:${s.accent}">${s.name}</div>
<div style="font-size:10px;display:flex;flex-direction:column;gap:3px;margin-top:4px">
<div>Par 3: <strong style="font-family:'DM Mono',monospace">${s.avgP3?s.avgP3.toFixed(1):'–'}</strong></div>
<div>Par 4: <strong style="font-family:'DM Mono',monospace">${s.avgP4?s.avgP4.toFixed(1):'–'}</strong></div>
<div>Par 5: <strong style="font-family:'DM Mono',monospace">${s.avgP5?s.avgP5.toFixed(1):'–'}</strong></div>
</div>
</div>`;
});
html+=`</div></div>`;

// Front 9 vs Back 9
html+=`<div class="dash-section"><div class="ds-title">FRONT 9 vs BACK 9</div>
<div class="dash-h2h">`;
allScored.forEach(s=>{
const fv=s.front-s.frontPar;
const bv=s.back-s.backPar;
const better=fv<bv?'Front':'Back';
html+=`<div class="dash-h2h-card" style="background:${s.accent}08">
<div class="hh-course" style="color:${s.accent}">${s.name}</div>
<div style="font-size:10px;margin-top:4px">
<div>F: <strong style="font-family:'DM Mono',monospace">${s.front}</strong> <span style="color:${fv<=0?'#1a7a4a':'#b82e3a'}">(${fv>0?'+':''}${fv})</span></div>
<div>B: <strong style="font-family:'DM Mono',monospace">${s.back}</strong> <span style="color:${bv<=0?'#1a7a4a':'#b82e3a'}">(${bv>0?'+':''}${bv})</span></div>
<div style="color:var(--t3);margin-top:2px">Better: ${better}</div>
</div>
</div>`;
});
html+=`</div></div>`;

// Highlights
html+=`<div class="dash-section"><div class="ds-title">TRIP HIGHLIGHTS</div>
<div class="dash-best">`;
const allBestHoles=stats.map(s=>{
const c=C[s.k];
const bestIdx=D[s.k].scores.reduce((bi,sc,i,arr)=>sc>0&&(arr[bi]===0||sc-c.holes[i].p<arr[bi]-c.holes[bi].p)?i:bi,0);
const bestSc=D[s.k].scores[bestIdx];
const bestVsPar=bestSc-c.holes[bestIdx].p;
return{course:s.name,accent:s.accent,hole:bestIdx+1,score:bestSc,par:c.holes[bestIdx].p,vs:bestVsPar};
});
const tripBest=allBestHoles.reduce((a,b)=>a.vs<b.vs?a:b);
html+=`<div class="dash-best-row"><span class="br-icon">🏆</span><span class="br-label">Best Hole</span><span class="br-val" style="color:${tripBest.accent}">#${tripBest.hole} ${tripBest.course} — ${tripBest.score} (${tripBest.vs>0?'+':''}${tripBest.vs})</span></div>`;
html+=`<div class="dash-best-row"><span class="br-icon">🐦</span><span class="br-label">Total Birdies+</span><span class="br-val" style="color:#e63946">${totalEagles+totalBirdies}</span></div>`;
html+=`<div class="dash-best-row"><span class="br-icon">⛳</span><span class="br-label">Total Pars</span><span class="br-val">${totalPars}</span></div>`;
html+=`<div class="dash-best-row"><span class="br-icon">📏</span><span class="br-label">Holes Played</span><span class="br-val">${holesPlayed} / 54</span></div>`;
if(bestRound){html+=`<div class="dash-best-row"><span class="br-icon">🥇</span><span class="br-label">Best Round</span><span class="br-val" style="color:${bestRound.accent}">${bestRound.name} — ${bestRound.total} (${bestRound.vs>0?'+':''}${bestRound.vs})</span></div>`;}
html+=`</div></div>`;

html+=`</div>`;
el.innerHTML=html;
}

init();
</script>
</body>
</html>
